<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 지역 문제 탐구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --ink:#24262B; --sub:#5F6470; --line:#DAD6CE; --paper:#FFFFFF; --bg:#F6F4EF;
  --blue:#3E70B5; --blue-bg:#E7EFF9;
  --amber:#B5791C; --amber-bg:#FAF1DF;
  --green:#3D8754; --green-bg:#E5F2E8;
  --rose:#C0507A; --rose-bg:#FAE8EF;
  --slate:#59616E; --slate-bg:#ECEDF0;
  --purple:#7461B5; --purple-bg:#EFEBF8;
  --warm:#857D72; --warm-bg:#F1EFEA;
  --display:'Jua','Noto Sans KR',system-ui,sans-serif;
  --body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #2B5DA8;outline-offset:2px}
.wrap{max-width:940px;margin:0 auto;padding:16px 18px 80px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.3}
h1{font-size:30px} h2{font-size:24px} h3{font-size:20px}
.muted{color:var(--sub)}
.small{font-size:14px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(246,244,239,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.top .in{max-width:940px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .who{font-family:var(--display);font-size:19px}
.top .sp{flex:1}
.status{font-size:14px;color:var(--sub)}
.status.err{color:#B3261E;font-weight:700}

/* buttons */
.btn{border:1.5px solid var(--ink);background:var(--paper);border-radius:999px;padding:8px 16px;font-weight:500;min-height:44px}
.btn.solid{background:var(--ink);color:#fff}
.btn.ghost{border-color:var(--line)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:6px 4px;text-decoration:underline;color:var(--sub);min-height:40px}

/* login */
.login{max-width:560px;margin:6vh auto 0;padding:0 18px}
.login h1{font-size:40px;margin-bottom:4px}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;margin:22px 0 18px}
.seg button{flex:1;border:0;background:transparent;padding:10px;font-weight:700;min-height:48px}
.seg button.on{background:var(--ink);color:#fff}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;margin:6px 0 16px}
.pick button{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;min-height:54px;font-family:var(--display);font-size:20px}
.pick button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-weight:700;margin-bottom:4px}
input[type=text],input[type=number],input[type=password],input[type=date],input[type=datetime-local],textarea,select{
  width:100%;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 12px;min-height:46px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus{border-color:var(--ink);outline:none}
.err-msg{color:#B3261E;font-weight:700;margin:8px 0}

/* home */
.problem{background:var(--paper);border:1.5px solid var(--ink);border-radius:18px;padding:16px 18px;margin:18px 0 22px}
.problem label{font-family:var(--display);font-size:20px;display:block;margin-bottom:6px}
.trail{display:grid;gap:12px}
.banner{display:flex;align-items:stretch;border-radius:18px;overflow:hidden;border:1.5px solid transparent;background:var(--paper);text-align:left;padding:0;width:100%}
.banner .tag{width:96px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:var(--display);font-size:30px;padding:10px 4px}
.banner .tag small{font-size:15px}
.banner .txt{padding:14px 16px;flex:1}
.banner .txt h3{margin-bottom:2px}
.banner .prog{font-size:14px;color:var(--sub);margin-top:4px}
.banner .go{align-self:center;padding:0 18px;font-family:var(--display);font-size:18px}
.c-blue{--c:var(--blue);--cb:var(--blue-bg)} .c-amber{--c:var(--amber);--cb:var(--amber-bg)}
.c-green{--c:var(--green);--cb:var(--green-bg)} .c-rose{--c:var(--rose);--cb:var(--rose-bg)}
.c-slate{--c:var(--slate);--cb:var(--slate-bg)} .c-purple{--c:var(--purple);--cb:var(--purple-bg)}
.c-warm{--c:var(--warm);--cb:var(--warm-bg)}
.banner{border-color:var(--c);background:var(--cb)} .banner .tag{background:var(--c)}
.done-mark{display:inline-block;background:var(--c);color:#fff;border-radius:999px;font-size:13px;padding:0 8px;margin-left:6px;vertical-align:2px;font-family:var(--body)}
.divider{margin:26px 0 10px;font-family:var(--display);font-size:20px;color:var(--sub)}

/* page */
.back{margin:14px 0 8px}
.pagehead{border-left:8px solid var(--c);padding:6px 0 6px 14px;margin-bottom:16px}
.pagehead .q{font-family:var(--display);font-size:28px}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:14px}
.card.tint{background:var(--cb);border-color:var(--c)}
.card h3{margin-bottom:10px}
.help{background:#FFFBEA;border:1.5px dashed #D9B44A;border-radius:14px;padding:10px 14px;margin:0 0 14px;font-size:15px}
.help b{font-family:var(--display);font-weight:400;font-size:17px}
.help ol,.help ul{margin:4px 0 0;padding-left:20px}
.warn{background:#FDECEA;border:1.5px solid #E29A93;border-radius:14px;padding:10px 14px;margin:0 0 14px;font-size:15px}
.warn b{font-family:var(--display);font-weight:400;font-size:17px;color:#9C2A20}
.methods{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px}
.method{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:12px 8px;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.method .ic{font-size:28px;line-height:1}
.method .nm{font-family:var(--display);font-size:19px}
.method.on{border-color:var(--blue);background:var(--blue-bg)}
.method.on .nm::after{content:" ✓";color:var(--blue)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--blue);margin-top:16px}
.tabs button{border:2px solid var(--line);border-bottom:0;background:var(--slate-bg);border-radius:12px 12px 0 0;padding:8px 16px;font-family:var(--display);font-size:18px;min-height:46px}
.tabs button.on{background:var(--paper);border-color:var(--blue);color:var(--blue);margin-bottom:-2px;border-bottom:2px solid var(--paper)}
.panel{background:var(--paper);border:2px solid var(--blue);border-top:0;border-radius:0 0 16px 16px;padding:16px 18px;margin-bottom:18px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks label{display:flex;align-items:center;gap:8px;min-height:40px}
.checks input{width:22px;height:22px}
.list-item{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#FCFBF8;position:relative}
.list-item .x{position:absolute;top:6px;right:6px;border:0;background:transparent;font-size:20px;color:var(--sub);min-width:40px;min-height:40px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:15px;min-height:38px;text-align:left}
.chip.rec{border-color:var(--green);background:var(--green-bg)}
.chip.rec::before{content:"★ 추천 ";color:var(--green);font-weight:700}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.ev{border-color:var(--blue);background:var(--blue-bg)}
.count{display:flex;align-items:center;gap:8px}
.count button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--ink);background:var(--paper);font-size:22px;line-height:1}
.count .n{font-family:var(--display);font-size:24px;min-width:34px;text-align:center}
.optrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:8px}
.bar{height:12px;border-radius:6px;background:var(--blue);margin-top:4px;transition:width .2s}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.photo{border:1.5px solid var(--line);border-radius:14px;overflow:hidden;background:#FCFBF8;position:relative}
.photo img{width:100%;height:190px;object-fit:cover;display:block;background:#ddd}
.photo .f{padding:10px}
.photo .f input{margin-bottom:6px}
.upload{display:inline-flex;align-items:center;gap:8px}
.upload input{display:none}
.fit button{min-width:52px}
.evid summary{cursor:pointer;color:var(--blue);font-weight:700;min-height:40px;display:flex;align-items:center}
.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;font-size:15px}
.mini div{background:#FCFBF8;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.mini b{display:block;font-size:13px;color:var(--sub)}

/* outline */
.stepper{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.stepper button{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:15px;min-height:38px}
.stepper button.ok{border-color:var(--green);background:var(--green-bg)}
.stepper button.ok::before{content:"✓ ";color:var(--green)}
.stepper button.cur{border-color:var(--ink);font-weight:700}
.ocard{display:grid;grid-template-columns:110px 1fr 220px;border:1.5px solid var(--c);border-radius:16px;overflow:hidden;background:var(--paper);margin-bottom:14px}
.ocard .lb{background:var(--c);color:#fff;font-family:var(--display);font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
.ocard .bd{padding:14px}
.ocard .gd{background:var(--cb);border-left:1.5px dashed var(--c);padding:14px;font-size:15px;color:#444}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.review .r{border:1.5px solid var(--c);background:var(--cb);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.review .r b{font-family:var(--display);font-weight:400;color:var(--c);font-size:17px}
.review .r p{margin:2px 0 0;white-space:pre-wrap}
.yn{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px dashed var(--line);padding:8px 0}
.yn .b{display:flex;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:50;font-size:15px}

/* teacher */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gcard{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:14px}
.gcard h3{margin-bottom:4px}
.gcard .p{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.gcard .p span{font-size:13px;border-radius:999px;padding:1px 9px;background:var(--slate-bg)}
.gcard .p span.y{background:var(--green-bg);color:var(--green);font-weight:700}
.gcard .acts{display:flex;gap:6px;flex-wrap:wrap}

/* sheet (screen + print) */
.sheet{background:#fff;color:#111;border:1px solid var(--line);padding:16mm 14mm;max-width:210mm;margin:0 auto 16px;font-size:12.5px;line-height:1.5}
.sheet h1{font-size:22px;border-bottom:2.5px solid #111;padding-bottom:4px;margin-bottom:6px}
.sheet .meta{display:flex;justify-content:space-between;font-size:12px;color:#444;margin-bottom:8px}
.sheet .sec{border:1.2px solid #999;border-radius:8px;margin-bottom:7px;overflow:hidden}
.sheet .sec>h2{font-size:15px;padding:3px 10px;color:#fff}
.sheet .sec .b{padding:6px 10px}
.sheet .s-blue>h2{background:var(--blue)} .sheet .s-amber>h2{background:var(--amber)} .sheet .s-green>h2{background:var(--green)}
.sheet table{width:100%;border-collapse:collapse}
.sheet td,.sheet th{border:1px solid #bbb;padding:3px 6px;vertical-align:top;text-align:left}
.sheet th{background:#f2f2f2;white-space:nowrap;width:1%}
.sheet .ph{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:4px}
.sheet .ph img{width:100%;height:28mm;object-fit:cover;border:1px solid #aaa}
.sheet .ph div{font-size:10.5px}
.sheet p{margin:2px 0}
.sheet .pre{white-space:pre-wrap}
.sheet .orow{display:grid;grid-template-columns:22mm 1fr 42mm;border:1.2px solid #999;border-radius:8px;overflow:hidden;margin-bottom:5px;min-height:15mm}
.sheet .orow .l{color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px}
.sheet .orow .c{padding:5px 8px;white-space:pre-wrap;font-size:13.5px}
.sheet .orow .g{border-left:1px dashed #999;padding:5px 8px;font-size:10.5px;color:#555}
.sheet .chk td{font-size:12px}
.sheet .lined{height:240mm;background:repeating-linear-gradient(#fff 0 9.5mm,#999 9.5mm 9.7mm);border:1.2px solid #999;border-radius:6px;margin-top:6px}
.pb{break-before:page;page-break-before:always}
#print{display:none}
#print.open{display:block;position:fixed;inset:0;z-index:100;overflow:auto;background:#8A8F98;padding:calc(64px + env(safe-area-inset-top,0px)) 12px 40px}
#print.open .sheet{box-shadow:0 2px 10px rgba(0,0,0,.25);border:0}
.pv-bar{position:fixed;top:0;left:0;right:0;z-index:101;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.pv-bar .t{font-family:var(--display);font-size:19px;flex:1}
.pv-bar .btn{border-color:#fff}
.pv-note{max-width:210mm;margin:0 auto 12px;background:#FFFBEA;border:1.5px solid #D9B44A;border-radius:12px;padding:10px 14px;font-size:15px;color:#333}

@media (max-width:720px){
  .methods{grid-template-columns:repeat(2,1fr)}
  .row{grid-template-columns:1fr}
  .ocard{grid-template-columns:1fr}
  .ocard .lb{flex-direction:row;gap:6px}
  .ocard .gd{border-left:0;border-top:1.5px dashed var(--c)}
  .banner .tag{width:70px;font-size:24px}
  .banner .go{display:none}
  .mini{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  #app,.toast{display:none!important}
  #print,#print.open{display:block;position:static;padding:0;background:#fff;overflow:visible}
  .pv-bar,.pv-note{display:none!important}
  #print.open .sheet{box-shadow:none}
  .sheet{border:0;margin:0;max-width:none;width:210mm;min-height:297mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>

<script>
/* =========================================================
   설정: 구글 Apps Script 웹 앱 URL을 붙여 넣으세요.
   비워 두면 '체험 모드'로 이 기기에만 저장됩니다.
   ========================================================= */
const SCRIPT_URL = '';
const SCHOOL = '이솔초등학교';
const GRADE = 4;
const CLASS_COUNT = 9;
const GROUP_COUNT = 8;

/* ---------- 기본 데이터 ---------- */
const DEFAULTS = {
  meta: () => ({ problem: '' }),
  methods: () => ({ list: [] }),
  s_interview: () => ({ who: '', date: '', permit: false, thanks: false, qa: [{ q: '', a: '' }], learned: '' }),
  s_survey: () => ({ target: '', qs: [], learned: '' }),
  s_photo: () => ({ items: [], learned: '' }),
  s_etc: () => ({ name: '', content: '', learned: '' }),
  s_summary: () => ({ when: '', where: '', how: '', who: '' }),
  cause: () => ({ items: [{ text: '', from: [] }, { text: '', from: [] }], main: -1, ideas: ['', '', ''], pick: -1 }),
  case: () => ({ items: [{ region: '', how: '', result: '', source: '', fit: '', why: '' }], sentence: '' }),
  outline: () => ({ to: '', toWhy: '', title: '', hello: '', situation: '', evid: 0, content: '', reason: '', bye: '', yn: {} })
};
const METHODS = [
  { id: 'interview', sec: 's_interview', ic: '🎤', nm: '면담 조사' },
  { id: 'survey', sec: 's_survey', ic: '📋', nm: '설문 조사' },
  { id: 'photo', sec: 's_photo', ic: '📷', nm: '사진 찍기' },
  { id: 'etc', sec: 's_etc', ic: '✏️', nm: '기타' }
];

/* ---------- 상태 ---------- */
const S = {
  role: null, cls: null, group: null, num: null, pw: null,
  data: { sections: {}, photos: {} },
  view: 'login', tab: null, step: 0,
  dirty: {}, saving: 0, lastSaved: null, error: '',
  teacherGroups: null, loginTab: 'student', printLined: true
};

/* ---------- 유틸 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nl = s => esc(s).replace(/\n/g, '<br>');
const josa = (w, a, b) => { const c = w.charCodeAt(w.length - 1); return (c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28) ? a : b; };
const filled = s => String(s || '').trim().length > 0;
function get(sec) {
  const s = S.data.sections[sec];
  if (!s || !s.value || typeof s.value !== 'object') {
    S.data.sections[sec] = { value: DEFAULTS[sec](), by: '', at: 0 };
  }
  return S.data.sections[sec].value;
}
function setPath(obj, path, val) {
  const ks = path.split('.');
  let o = obj;
  for (let i = 0; i < ks.length - 1; i++) {
    const k = isNaN(ks[i]) ? ks[i] : Number(ks[i]);
    if (o[k] == null) o[k] = isNaN(ks[i + 1]) ? {} : [];
    o = o[k];
  }
  const last = ks[ks.length - 1];
  o[isNaN(last) ? last : Number(last)] = val;
}
function getPath(obj, path) {
  return path.split('.').reduce((o, k) => (o == null ? o : o[isNaN(k) ? k : Number(k)]), obj);
}
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}
function hhmm(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
}
function lastBy(sec) {
  const s = S.data.sections[sec];
  if (!s || !s.at) return '';
  return `<span class="small muted">마지막 저장: ${esc(s.by)}번 ${hhmm(s.at)}</span>`;
}

/* ---------- 저장소 ---------- */
function makeStore(kind) {
  const mem = {};
  let area = null;
  try { area = window[kind]; const k = '__jt'; area.setItem(k, '1'); area.removeItem(k); } catch (e) { area = null; }
  return {
    persistent: !!area,
    get(k) { if (k in mem) return mem[k]; if (area) { try { return area.getItem(k); } catch (e) {} } return null; },
    set(k, v) { mem[k] = v; if (area) { try { area.setItem(k, v); } catch (e) {} } },
    del(k) { delete mem[k]; if (area) { try { area.removeItem(k); } catch (e) {} } }
  };
}
const LS = makeStore('localStorage');
const SS = makeStore('sessionStorage');
const demo = {
  all() { try { return JSON.parse(LS.get('jt-demo') || '{}'); } catch (e) { return {}; } },
  put(a) { LS.set('jt-demo', JSON.stringify(a)); },
  grp(a, c, g) { a[c] = a[c] || {}; a[c][g] = a[c][g] || { sections: {}, photos: {} }; return a[c][g]; }
};
const api = {
  async get(params) {
    const r = await fetch(SCRIPT_URL + '?' + new URLSearchParams(params));
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '불러오지 못했습니다.');
    return j;
  },
  async post(body) {
    const r = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(body) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '저장하지 못했습니다.');
    return j;
  },

/* ---------- 자동 저장 ---------- */
const timers = {};
function markDirty(sec) {
  S.dirty[sec] = true;
  setStatus();
  clearTimeout(timers[sec]);
  timers[sec] = setTimeout(() => flush(sec), 1200);
}
async function flush(sec) {
  if (!S.dirty[sec] || S.role !== 'student') return;
  S.dirty[sec] = false; S.saving++; setStatus();
  try {
    const at = await api.save(sec, get(sec));
    S.data.sections[sec].by = S.num; S.data.sections[sec].at = at;
    S.lastSaved = Date.now(); S.error = '';
  } catch (e) {
    S.dirty[sec] = true; S.error = e.message || '저장하지 못했습니다. 인터넷 연결을 확인하세요.';
    clearTimeout(timers[sec]); timers[sec] = setTimeout(() => flush(sec), 5000);
  }
  S.saving--; setStatus();
}
async function flushAll() { await Promise.all(Object.keys(S.dirty).filter(k => S.dirty[k]).map(flush)); }
function setStatus() {
  const el = $('#status'); if (!el) return;
  const pending = Object.values(S.dirty).some(Boolean);
  el.className = 'status' + (S.error ? ' err' : '');
  el.textContent = S.error ? S.error
    : S.saving || pending ? '저장 중…'
    : S.lastSaved ? '저장됨 ' + hhmm(S.lastSaved)
    : (SCRIPT_URL ? '' : LS.persistent ? '체험 모드 (이 기기에만 저장)' : '체험 모드 (새로고침하면 지워져요)');
}
async function refresh(quiet) {
  if (S.role !== 'student') return;
  try {
    const d = await api.load(S.cls, S.group);
    Object.keys(d.sections || {}).forEach(k => { if (!S.dirty[k]) S.data.sections[k] = d.sections[k]; });
    S.data.photos = Object.assign(S.data.photos, d.photos || {});
    if (!quiet) toast('모둠 친구들이 쓴 내용을 불러왔어요.');
    const a = document.activeElement;
    if (!quiet || !(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'))) render();
  } catch (e) { if (!quiet) toast('불러오지 못했어요. 인터넷 연결을 확인하세요.'); }
}
setInterval(() => { if (S.role === 'student' && !document.hidden) refresh(true); }, 20000);
window.addEventListener('beforeunload', e => { if (Object.values(S.dirty).some(Boolean)) { flushAll(); e.preventDefault(); e.returnValue = ''; } });

/* ---------- 진행 상황 ---------- */
function progress() {
  const m = get('methods').list;
  const sum = get('s_summary');
  const sumN = ['when', 'where', 'how', 'who'].filter(k => filled(sum[k])).length;
  const methodDone = id => {
    const v = get(METHODS.find(x => x.id === id).sec);
    return filled(v.learned) || (id === 'photo' && v.items.length > 0);
  };
  const c = get('cause'); const cs = get('case'); const o = get('outline');
  const oKeys = ['to', 'title', 'hello', 'situation', 'content', 'reason', 'bye'];
  return {
    methods: m.map(id => ({ id, done: methodDone(id) })),
    siltae: sumN >= 3 && m.some(methodDone), sumN,
    cause: c.main >= 0 && c.pick >= 0 && filled(c.ideas[c.pick]),
    case: cs.items.some(i => filled(i.region) && filled(i.how)) && filled(cs.sentence),
    outlineN: oKeys.filter(k => filled(o[k])).length, outlineTotal: oKeys.length
  };
}

/* ---------- 근거 자료 모으기 ---------- */
function evidence() {
  const out = [];
  const m = get('methods').list;
  if (m.includes('interview')) {
    const v = get('s_interview');
    if (filled(v.learned)) out.push({ k: '면담', t: v.learned.trim() });
  }
  if (m.includes('survey')) {
    const v = get('s_survey');
    v.qs.forEach(q => { const s = surveySentence(q); if (s) out.push({ k: '설문', t: s }); });
    if (filled(v.learned)) out.push({ k: '설문', t: v.learned.trim() });
  }
  if (m.includes('photo')) {
    const v = get('s_photo');
    v.items.forEach((it, i) => {
      if (filled(it.what)) out.push({ k: '사진 ' + (i + 1), t: [it.where && it.where + '에서', it.what].filter(Boolean).join(' ') + (/[.다요]$/.test(it.what.trim()) ? '' : josa(it.what.trim(), '을', '를') + ' 보았습니다.') });
    });
    if (filled(v.learned)) out.push({ k: '사진', t: v.learned.trim() });
  }
  if (m.includes('etc')) {
    const v = get('s_etc');
    if (filled(v.learned)) out.push({ k: v.name || '기타', t: v.learned.trim() });
  }
  return out;
}
function surveySentence(q) {
  const total = q.opts.reduce((a, o) => a + (o.n || 0), 0);
  if (!total) return '';
  const top = q.opts.filter(o => filled(o.t)).sort((a, b) => b.n - a.n)[0];
  if (!top || !top.n) return '';
  return `설문에 응답한 ${total}명 중 ${top.n}명이 '${top.t}'라고 답했습니다.`;
}
function evidPicker(sec, path, label) {
  const ev = evidence();
  if (!ev.length) return `<p class="small muted">아직 넣을 조사 자료가 없어요. 실태 조사에서 '알게 된 점'을 먼저 써 주세요.</p>`;
  return `<details class="evid"><summary>📎 ${label || '조사 자료에서 근거 넣기'} (${ev.length}개)</summary>
    <p class="small muted">누르면 위 칸 끝에 문장이 들어가요. 들어간 뒤에 자연스럽게 고쳐 써요.</p>
    <div class="chips">${ev.map(e => `<button class="chip ev" data-act="insert" data-sec="${sec}" data-path="${path}" data-text="${esc(e.t)}"><b>${esc(e.k)}</b> ${esc(e.t)}</button>`).join('')}</div></details>`;
}

function keywords() {
  const p = get('meta').problem.trim();
  if (!p) return [];
  const core = p.replace(/(이|가|은|는)?\s*(많다|많음|많아요|많습니다|심하다|부족하다|없다|있다|불편하다|위험하다)[.]?$/, '').replace(/[.?!]$/, '').trim() || p;
  return [`${core} 해결 사례`, `${core} 줄이기 방법`, `${core} 캠페인`, `${core} 우수 사례`, `다른 지역 ${core} 해결`, `화성시 ${core}`];
}

    }
    case 'insert': {
      const t = b.dataset.text; appendTo(b.dataset.sec, b.dataset.path, t);
      if (b.dataset.sec === 'outline' && b.dataset.path === 'situation' && b.classList.contains('ev')) get('outline').evid = (get('outline').evid || 0) + 1;
      markDirty(b.dataset.sec); rerender(); toast('넣었어요. 자연스럽게 고쳐 써요.'); break;
    }
    case 'setv': {
      const cur = getPath(get(b.dataset.sec), b.dataset.path);
      if (filled(cur) && b.dataset.path !== 'to' && b.dataset.path !== 'toWhy' && !confirm('지금 쓴 내용을 바꿀까요?')) break;
      setPath(get(b.dataset.sec), b.dataset.path, b.dataset.text); markDirty(b.dataset.sec); rerender(); break;
    }
    case 'from': { const f = get('cause').items[i].from; const k = f.indexOf(val); k >= 0 ? f.splice(k, 1) : f.push(val); markDirty('cause'); rerender(); break; }
    case 'main': get('cause').main = get('cause').main === i ? -1 : i; markDirty('cause'); rerender(); break;
    case 'addcause': get('cause').items.push({ text: '', from: [] }); markDirty('cause'); rerender(); break;
    case 'pickidea': get('cause').pick = get('cause').pick === i ? -1 : i; markDirty('cause'); rerender(); break;
    case 'copy': copyText(b.dataset.text); break;
    case 'fit': get('case').items[i].fit = val; markDirty('case'); rerender(); break;
    case 'addcase': get('case').items.push({ region: '', how: '', result: '', source: '', fit: '', why: '' }); markDirty('case'); rerender(); break;
    case 'mksent': {
      const it = get('case').items[i];
      if (!filled(it.region) || !filled(it.how)) { toast('지역과 해결 방법을 먼저 써요.'); break; }
      const dot = t => { t = t.trim(); return /[.!?]$/.test(t) ? t : t + '.'; };
      const s = `${it.region.trim()}에서는 ${dot(it.how)} 그 결과 ${filled(it.result) ? dot(it.result) : '○○가 좋아졌습니다.'} 우리 지역도 이렇게 하면 문제를 줄일 수 있습니다.`;
      appendTo('case', 'sentence', s);
      markDirty('case'); rerender(); toast('문장을 만들었어요. 자연스럽게 고쳐 써요.'); break;
    }
    case 'step': S.step = i; await flushAll(); rerender(); window.scrollTo(0, 0); break;
    case 'yn': { const o = get('outline'); o.yn = o.yn || {}; o.yn[i] = val; markDirty('outline'); rerender(); break; }
    case 'doprint': {
      const imgs = [...document.querySelectorAll('#print img')];
      await Promise.all(imgs.map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
      try { window.print(); } catch (err) { toast('이 화면에서는 인쇄할 수 없어요.'); }
      break;
    }
    case 'closeprint': $('#print').classList.remove('open'); $('#print').innerHTML = ''; document.body.style.overflow = ''; break;
    case 'print': doPrint(val === 'summary' ? sheetSummary(S.data, S.cls, S.group) : sheetOutline(S.data, S.cls, S.group, S.printLined)); break;
    case 'treload': S.teacherGroups = null; render(); loadTeacher(); break;
    case 'topen': {
      try { S.group = b.dataset.i; S.data = await api.teacherGroup(b.dataset.i); S.view = val; S.step = STEPS.length - 1; render(); window.scrollTo(0, 0); }
      catch (err) { toast(err.message); } break;
    }
    case 'tprintall': {
      toast('모둠 자료를 모으는 중…');
      try {
        const keys = Object.keys(S.teacherGroups).sort((x, y) => x - y); const parts = [];
        for (const g of keys) {
          const d = await api.teacherGroup(g);
          parts.push(val === 'summary' ? sheetSummary(d, S.cls, g) : sheetOutline(d, S.cls, g, false));
        }
        doPrint(parts.map((p, k) => k ? p.replace('<div class="sheet">', '<div class="sheet pb">') : p).join(''));
      } catch (err) { toast(err.message); }
      break;
    }
  }
});
function appendTo(sec, path, text) {
  const cur = getPath(get(sec), path) || '';
  setPath(get(sec), path, cur.trim() ? cur.replace(/\s+$/, '') + '\n' + text : text);
  markDirty(sec);
}
function copyText(t) {
  const done = () => toast(`'${t}' 복사했어요.`);
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, () => fallback());
  else fallback();
  function fallback() { const x = document.createElement('textarea'); x.value = t; document.body.appendChild(x); x.select(); try { document.execCommand('copy'); done(); } catch (e) { toast(t); } x.remove(); }
}
function doPrint(html) {
  const framed = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
  const pv = $('#print');
  pv.innerHTML = `<div class="pv-bar"><span class="t">인쇄 미리보기</span>
      <button class="btn sm solid" style="background:#fff;color:var(--ink)" data-act="doprint">🖨️ 인쇄하기</button>
      <button class="btn sm" style="background:transparent;color:#fff" data-act="closeprint">닫기</button></div>
    ${framed ? `<div class="pv-note">지금은 다른 화면 안에 들어 있는 미리보기 창이라 인쇄 창이 열리지 않을 수 있어요. 인쇄가 안 되면 이 파일을 내려받아 크롬에서 열거나, GitHub Pages 주소에서 인쇄하세요.</div>` : ''}
    ${html}`;
  pv.classList.add('open'); pv.scrollTop = 0;
  document.body.style.overflow = 'hidden';
}

/* ---------- 사진 ---------- */
function compress(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      let max = 1000, q = 0.72, out = '';
      const c = document.createElement('canvas'); const ctx = c.getContext('2d');
      for (let k = 0; k < 14; k++) {
        const r = Math.min(1, max / Math.max(img.width, img.height));
        c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', q);
        if (out.length < 45000) break;
        if (q > 0.4) q -= 0.08; else max = Math.round(max * 0.82);
      }
      URL.revokeObjectURL(url);
      out.length < 45000 ? resolve(out) : reject(new Error('사진이 너무 커요.'));
    };
    img.onerror = () => reject(new Error('사진을 열 수 없어요.'));
    img.src = url;
  });
}
async function uploadPhotos(files) {
  const v = get('s_photo'); const msg = $('#upmsg');
  const list = [...files].slice(0, 4 - v.items.length);
  for (const f of list) {
    if (msg) msg.textContent = '사진 올리는 중…';
    try {
      const data = await compress(f);
      const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      await api.savePhoto(id, data);
      S.data.photos[id] = data;
      v.items.push({ id, what: '', when: '', where: '' });
      markDirty('s_photo'); await flush('s_photo');
    } catch (e) { toast(e.message || '사진을 올리지 못했어요.'); }
  }
  render();
}

/* ---------- 로그인 ---------- */
async function studentLogin() {
  const num = Number(($('#lnum') || {}).value);
  if (!S.p_cls || !S.p_group || !num) { S.error = '반, 모둠, 번호를 모두 골라요.'; render(); return; }
  S.error = ''; S.role = 'student'; S.cls = S.p_cls; S.group = S.p_group; S.num = num;
  try { S.data = await api.load(S.cls, S.group); }
  catch (e) { S.role = null; S.error = '자료를 불러오지 못했어요. 인터넷 연결을 확인하세요.'; render(); return; }
  LS.set('jt-session', JSON.stringify({ role: 'student', cls: S.cls, group: S.group, num: S.num }));
  S.view = 'home'; render();
}
async function teacherLogin() {
  const pw = ($('#lpw') || {}).value;
  if (!S.p_cls || !pw) { S.error = '반과 비밀번호를 입력해요.'; render(); return; }
  let ok = false;
  try { ok = await api.teacherLogin(S.p_cls, pw); } catch (e) { S.error = '연결하지 못했어요.'; render(); return; }
  if (!ok) { S.error = '비밀번호가 맞지 않습니다.'; render(); return; }
  S.error = ''; S.role = 'teacher'; S.cls = S.p_cls; S.pw = pw; S.view = 'teacher';
  SS.set('jt-teacher', JSON.stringify({ cls: S.cls, pw }));
  render(); loadTeacher();
}
async function loadTeacher() {
  try { S.teacherGroups = await api.teacherList(); }
  catch (e) { S.teacherGroups = {}; toast(e.message); }
  if (S.view === 'teacher') render();
}

/* ---------- 시작 ---------- */
(async function init() {
  try {
    const t = JSON.parse(SS.get('jt-teacher') || 'null');
    const s = JSON.parse(LS.get('jt-session') || 'null');
    if (t) { S.role = 'teacher'; S.cls = t.cls; S.pw = t.pw; S.view = 'teacher'; render(); loadTeacher(); return; }
    if (s && s.role === 'student') {
      S.role = 'student'; S.cls = s.cls; S.group = s.group; S.num = s.num;
      S.data = await api.load(S.cls, S.group); S.view = 'home';
    }
  } catch (e) { S.role = null; S.view = 'login'; }
  render();
})();
</script>
